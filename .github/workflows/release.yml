name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Version prüfen
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: PC/SC-Buildabhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -q
      - name: Offline-Abhängigkeiten bauen
        run: python -m pip wheel --wheel-dir wheelhouse -r requirements.txt
      - name: Release-Paket signieren
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
          RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_BASE64"
          test -n "$RELEASE_SIGNING_KEY_PASSWORD"
          printf '%s' "$RELEASE_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing-key.pem"
          printf '%s' "$RELEASE_SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/release-signing-key-password"
          chmod 600 "$RUNNER_TEMP/release-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/release-signing-key-password"
          ./scripts/build-release.sh --wheelhouse wheelhouse --signing-key "$RUNNER_TEMP/release-signing-key.pem" --signing-key-password-file "$RUNNER_TEMP/release-signing-key-password"
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
