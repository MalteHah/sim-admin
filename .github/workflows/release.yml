name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Version prüfen
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: PC/SC-Buildabhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -q
      - name: Release-Paket bauen
        run: ./scripts/build-release.sh
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
